[project]
name = "kernelforge-nki-mcp"
version = "0.1.0"
description = "MCP server for the Kernel Forge NKI optimization agent (PyTorch / Triton -> NKI on AWS Trainium)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT-0" }
dependencies = [
    "mcp>=1.0.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[dependency-groups]
dev = [
    "pip-audit>=2.7",
]

[project.scripts]
kernelforge-nki-mcp = "kernelforge_nki_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernelforge_nki_mcp"]
