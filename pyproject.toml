[project]
name = "atx-nki-agent-dev"
version = "0.1.0"
description = "Root dev-tooling project for the ATX NKI Agent repo (lint/format/test/audit only — no runtime package)."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "flask>=3.0",
    "ruff>=0.5",
    "pip-audit>=2.7",
    # Needed by the live on-device tier of tests/test_integration_chain.py, which
    # calls invoke_agent_runtime directly. Only the gated live tests import it,
    # but it belongs here so a plain `pytest` with NKI_LIVE=1 works without
    # ad-hoc `uv run --with boto3`.
    "boto3>=1.34.0",
]

[tool.uv]
package = false
# exclude-newer = "7 days"
