[project]
name = "atx-nki-agentcore"
version = "0.1.0"
description = "AgentCore Runtime entrypoint for the ATX NKI Agent Plugin."
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.18.1",
    "strands-agents>=0.5.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.7",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "router"]
